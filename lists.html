<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lists</h1>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Samsung</li>
    </ul>

    <ol>
        <li>Wake up</li>
        <li>Brush</li>
        <li>Eat</li>
    </ol>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>


    
</body>
</html>
